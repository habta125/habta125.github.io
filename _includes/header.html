<header class="site-header">
  <div class="top-nav">
    <div class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>

    <nav class="nav-links">
      {% for p in site.header_pages %}
        {% assign my_page = site.pages | where: "path", p | first %}
        {% if my_page %}
          <a
            href="{{ my_page.url | relative_url }}"
            class="{% if page.url == my_page.url %}active{% endif %}">
            {{ my_page.title }}
          </a>
        {% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
