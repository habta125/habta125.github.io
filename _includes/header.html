<header class="site-header">
  <nav class="top-nav">
    <a class="site-title" href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>

    <div class="nav-links">
      {% for p in site.header_pages %}
        {% assign my_page = site.pages | where: "path", p | first %}
        {% if my_page %}
          <a href="{{ my_page.url | relative_url }}">
            {{ my_page.title }}
          </a>
        {% endif %}
      {% endfor %}
    </div>
  </nav>
</header>
