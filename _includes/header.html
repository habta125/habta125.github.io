<header class="site-header">
  <div class="top-nav">
    <div class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>

    <nav class="nav-links">
      {% for page in site.header_pages %}
        <a href="{{ page | relative_url }}">{{ page | replace: '.md','' | capitalize }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
