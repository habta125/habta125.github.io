<div class="profile">

  <div class="profile-photo">
    <img src="{{ '/assets/img/profile.jpg' | relative_url }}" alt="Profile photo">
  </div>

  <h2>{{ site.profile.name }}</h2>
  <div class="muted">{{ site.profile.role }}</div>
  <div class="muted">{{ site.profile.affiliation }}</div>
  <div class="muted">{{ site.profile.location }}</div>

  <p class="tagline">{{ site.profile.tagline }}</p>

  <div class="links">
    <a href="mailto:{{ site.links.email }}">Email</a>
    <a href="https://github.com/{{ site.links.github }}">GitHub</a>
    <a href="https://orcid.org/{{ site.links.orcid }}">ORCID</a>
  </div>

</div>
